name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A superseded run has nothing left to publish, and an emulation-hung build can
# otherwise sit for hours next to the newer commits it was replaced by.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "18"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The lockfile is generated on arm64 (Raspberry Pi), so npm ci does not
      # fetch sharp's linux-x64 binary that the CI runner needs. Install the
      # platform-specific @img packages directly.
      - name: Install sharp binary for runner platform
        run: npm install --no-save @img/sharp-linux-x64@0.35.1 @img/sharp-libvips-linux-x64@1.3.0

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Only the audit runs here, so the Node version is free to be newer than
      # the runtime's 18: npm 10 asks the registry's "quick" audit endpoint,
      # which npm has retired and which now answers 400 for every tree. npm 11
      # uses the bulk advisory endpoint instead, and it needs Node >= 20.17.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Use npm 11 (bulk advisory endpoint)
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      # Gate the build only on critical vulnerabilities. High/moderate are
      # reported below but do not fail CI (the known Next.js DoS advisories
      # have no fix on the 14.x line and require a major upgrade).
      #
      # A failed audit and an audit that never ran are not the same thing, and
      # npm exits 1 for both: the registry has served the advisory endpoint as
      # undeclared gzip, which npm reports as invalid JSON. Only a real report
      # (it always carries .metadata.vulnerabilities) can fail this job; an
      # unreachable endpoint is retried, then warned about, so a registry
      # outage cannot silently pass as "no vulnerabilities" either.
      - name: Audit production dependencies (fail on critical)
        run: |
          for attempt in 1 2 3; do
            if report=$(npm audit --omit=dev --audit-level=critical --json 2>audit-stderr.log); then
              echo "$report" | jq -c '.metadata.vulnerabilities'
              echo "No critical vulnerabilities in production dependencies."
              exit 0
            fi
            if printf '%s' "$report" | jq -e '.metadata.vulnerabilities' >/dev/null 2>&1; then
              printf '%s' "$report" | jq '.metadata.vulnerabilities'
              echo "::error::Critical vulnerabilities found in production dependencies."
              exit 1
            fi
            echo "::warning::npm audit did not return a report (attempt $attempt of 3)."
            cat audit-stderr.log
            sleep 15
          done
          echo "::warning::Audit gate skipped: the registry never returned a usable report."

      - name: Report high/moderate vulnerabilities (non-blocking)
        if: always()
        run: npm audit --omit=dev || true

  publish:
    name: Build & push image
    needs: [build, audit]
    # Only a merged main commit is worth an image; a PR run would publish code
    # that is not deployed anywhere.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Native arm64 runner (free for public repos). The only deploy target is the
    # arm64 Pi, so building here avoids QEMU entirely — emulated arm64 Next.js
    # builds intermittently die on SIGILL or hang for hours in V8's JIT.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
